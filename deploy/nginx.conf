# deploy/nginx.conf
# Entregable de desarrollo (ver §11.1 del plan).
# Los certificados TLS los provee infraestructura.
#
# IMPORTANTE (primer arranque): el bloque 443 exige que ya existan los archivos
# de /etc/letsencrypt/live/bet.mondragonmexico.edu.mx/. Si nginx aún no tiene
# certificado, créalo primero como self-signed temporal para que nginx pueda
# arrancar y así el authenticator HTTP-01 de `certbot --nginx` pueda operar
# (certbot sustituye este certificado por el real y recarga nginx):
#
#   sudo mkdir -p /etc/letsencrypt/live/bet.mondragonmexico.edu.mx
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
#     -subj "/CN=bet.mondragonmexico.edu.mx" \
#     -keyout /etc/letsencrypt/live/bet.mondragonmexico.edu.mx/privkey.pem \
#     -out    /etc/letsencrypt/live/bet.mondragonmexico.edu.mx/fullchain.pem
#
# Después de eso: sudo nginx -t && sudo systemctl reload nginx, y luego corre
# tu comando `sudo certbot --nginx ... -d bet.mondragonmexico.edu.mx` normal.

server {
    listen 80;
    server_name bet.mondragonmexico.edu.mx;

    # Requerido por certbot (challenge HTTP-01) antes de emitir el certificado
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bet.mondragonmexico.edu.mx;

    # Certificados TLS — rutas proporcionadas por infraestructura (o certbot)
    ssl_certificate     /etc/letsencrypt/live/bet.mondragonmexico.edu.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bet.mondragonmexico.edu.mx/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad (complementan Helmet en Node)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Coincide con el límite de subida de materiales (500 MB, ver material.routes.ts)
    client_max_body_size 500M;

    # ── API (Node/Express en PM2) ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Frontend (build estático de Vite) ─────────────────────────────────────
    location / {
        root  /var/www/control-alumnos/web;
        index index.html;
        # Ruteo SPA: todas las rutas desconocidas sirven index.html
        try_files $uri $uri/ /index.html;
    }
}
