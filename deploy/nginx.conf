# deploy/nginx.conf
# Entregable de desarrollo (ver §11.1 del plan).
# Los certificados TLS los provee infraestructura.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Certificados TLS — rutas proporcionadas por infraestructura
    # ssl_certificate     /etc/ssl/certs/umx.crt;
    # ssl_certificate_key /etc/ssl/private/umx.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad (complementan Helmet en Node)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API (Node/Express en PM2) ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Frontend (build estático de Vite) ─────────────────────────────────────
    location / {
        root  /var/www/control-alumnos/web;
        index index.html;
        # Ruteo SPA: todas las rutas desconocidas sirven index.html
        try_files $uri $uri/ /index.html;
    }
}
